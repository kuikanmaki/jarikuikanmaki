<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sources and Notes — Origins of Coronavirus | Jari Kuikanmäki</title>
  <meta name="description" content="Chapter-by-chapter sources and author's notes for Origins of Coronavirus by Jari Kuikanmäki — over 400 primary documents behind the investigation." />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans:    ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            display: ['"Space Grotesk"', 'Inter', 'sans-serif'],
          },
          colors: {
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            card:       'hsl(var(--card))',
            border:     'hsl(var(--border))',
            accent:     'hsl(var(--accent))',
            muted: { foreground: 'hsl(var(--muted-foreground))' },
          },
        },
      },
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="sources-page bg-background text-foreground font-sans overflow-x-hidden">

  <div id="site-header"></div>

  <main class="min-h-screen bg-background text-foreground overflow-x-hidden">

    <!-- ============================================================
         BOOK SALES BANNER (compact, full-width strip)
         ============================================================ -->
    <aside class="sources-book-banner" aria-label="Buy the book">
      <div class="container-narrow">
        <div class="sources-book-banner-inner">
          <a href="https://mybook.to/origins-amazon" target="_blank" rel="noopener noreferrer" class="sources-book-banner-cover">
            <img
              src="/assets/img/book-cover-thumb.webp"
              alt="Cover of Origins of Coronavirus"
              width="40" height="60" loading="lazy"
            />
          </a>
          <div class="sources-book-banner-copy">
            <h2 class="font-display">
              <span class="sources-banner-title-accent">Origins of Corona</span><span class="sources-banner-title-red">virus</span>
            </h2>
            <p class="sources-book-banner-tagline">
              Wuhan, the Secret Research That Sparked the Pandemic, and the Cover-Up of the Century
            </p>
            <div class="sources-banner-cta" data-editions data-sort="retailer"></div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ============================================================
         SOURCES AND NOTES
         ============================================================ -->
    <section id="sources">
      <div class="container-narrow">

        <div class="mx-auto max-w-3xl">
          <h1 id="sources-top" class="font-display font-bold">Sources and Notes</h1>
          <p class="sources-intro">
            Search the evidence behind <em class="not-italic text-foreground">Origins of Coronavirus</em>
            by name or topic, or browse by chapter.
          </p>

          <div class="sources-search" id="sources-search">
            <div class="sources-search-controls">
              <div class="sources-search-field">
                <input
                  id="authority-search-input"
                  type="text"
                  autocomplete="off"
                  spellcheck="false"
                  disabled
                  placeholder="Loading catalog…"
                  aria-label="Search the catalog"
                  aria-autocomplete="list"
                  aria-controls="authority-search-suggestions"
                  aria-expanded="false"
                />
                <span class="sources-search-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="M20 20l-3.5-3.5"></path>
                  </svg>
                </span>
                <button
                  type="button"
                  id="authority-search-clear"
                  class="sources-search-clear"
                  hidden
                  aria-label="Clear search"
                  title="Clear search"
                >
                  <span aria-hidden="true">×</span>
                </button>
              </div>
            </div>
            <ul
              id="authority-search-suggestions"
              class="sources-search-suggestions"
              role="listbox"
              hidden
            ></ul>
          </div>

          <div id="catalog-shelves" class="catalog-shelves">
            <div class="catalog-shelf catalog-shelf-examples">
              <h2 class="catalog-shelf-title" id="explore-keywords-label">Most cited</h2>
              <div id="explore-keywords" class="catalog-explore" aria-labelledby="explore-keywords-label">
                <span class="status">Loading…</span>
              </div>
            </div>
            <div class="catalog-shelf catalog-shelf-chapters">
              <label class="catalog-shelf-title" for="chapter-select">Chapters</label>
              <div id="chapter-list">
                <select id="chapter-select" class="catalog-chapter-select" aria-label="Select a chapter" disabled>
                  <option value="">Loading chapters…</option>
                </select>
              </div>
            </div>
          </div>

          <h2 id="sources-heading" hidden>Sources</h2>
          <div id="sources-output" aria-live="polite"></div>
          <div id="catalog-pager" class="catalog-pager" hidden></div>
          <div id="catalog-notes" class="catalog-notes" hidden></div>
          <p id="back-to-top" hidden class="back-to-top">
            <a href="#sources-top" class="text-sm font-semibold text-accent hover:underline">↑ Back to Top</a>
          </p>
        </div>

      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <script>
    (async () => {
      const load = async (id, url) => {
        const res = await fetch(url);
        document.getElementById(id).innerHTML = await res.text();
      };
      await Promise.all([
        load("site-header", "/header.html"),
        load("site-footer", "/footer.html"),
      ]);
      document.dispatchEvent(new Event('site-partials-loaded'));
    })();
  </script>

  <script src="/assets/js/minisearch.min.js"></script>
  <script src="corpus-catalog.js"></script>
  <script src="/data/origins-editions.js"></script>
  <script src="/script.js"></script>
</body>
</html>
