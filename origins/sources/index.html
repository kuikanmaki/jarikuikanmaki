<body class="sources-page bg-background text-foreground font-sans">

  <div id="site-header"></div>

  <main class="min-h-screen bg-background text-foreground">

    <!-- ============================================================
         BOOK SALES BANNER (compact, full-width strip)
         ============================================================ -->
    <aside class="sources-book-banner" aria-label="Buy the book">
      <div class="container-narrow">
        <div class="sources-book-banner-inner">
          <div class="sources-book-banner-copy">
            <h2 class="font-display">Origins of Coronavirus</h2>
            <p class="sources-book-banner-tagline">
              Wuhan, the Secret Research That Sparked the Pandemic, and the Cover-Up of the Century
            </p>
          </div>
          <a href="https://mybook.to/origins-amazon" target="_blank" rel="noopener noreferrer" class="sources-book-banner-cover" aria-label="Buy Origins of Coronavirus on Amazon">
            <img
              src="/assets/img/book-cover-thumb.webp"
              alt=""
              width="40" height="60" loading="lazy"
            />
          </a>
          <div class="sources-banner-cta" data-editions data-sort="retailer"></div>
        </div>
      </div>
    </aside>

    <!-- ============================================================
         SOURCES AND NOTES
         ============================================================ -->
    <section id="sources">
      <div class="container-narrow">

        <div class="mx-auto max-w-3xl">
          <h1 id="sources-top" class="font-display font-bold">Sources and Notes</h1>
          <p class="sources-intro">
            Search sources from
            <em class="not-italic text-foreground">Origins of Coronavirus</em>,
            or select a chapter for its sources and notes.
          </p>

          <div class="sources-search" id="sources-search">
            <div class="sources-search-controls">
              <div class="sources-search-field">
                <input
                  id="authority-search-input"
                  type="text"
                  autocomplete="off"
                  spellcheck="false"
                  disabled
                  placeholder="Loading catalog…"
                  aria-label="Search the catalog"
                  aria-autocomplete="list"
                  aria-controls="authority-search-suggestions"
                  aria-expanded="false"
                />
                <span class="sources-search-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="M20 20l-3.5-3.5"></path>
                  </svg>
                </span>
                <button
                  type="button"
                  id="authority-search-clear"
                  class="sources-search-clear"
                  hidden
                  aria-label="Clear search"
                  title="Clear search"
                >
                  <span aria-hidden="true">×</span>
                </button>
              </div>
              <ul
                id="authority-search-suggestions"
                class="sources-search-suggestions"
                role="listbox"
                hidden
              ></ul>
            </div>
            <div class="catalog-topic-cloud-wrap" id="sources-topic-cloud">
              <div
                id="topic-cloud"
                class="catalog-topic-cloud"
                role="group"
                aria-label="Most indexed topics"
              >
                <span class="status">Loading…</span>
              </div>
            </div>
          </div>

          <div id="catalog-shelves" class="catalog-shelves">
            <div class="catalog-shelf catalog-shelf-chapters" id="sources-chapters">
              <label class="catalog-shelf-title" id="chapters-label" for="chapter-custom-trigger">Chapters</label>
              <div id="chapter-list" class="catalog-chapter-picker">
                <select id="chapter-select" class="catalog-chapter-select" aria-label="Choose a chapter" disabled>
                  <option value="">Loading chapters…</option>
                </select>
                <div class="catalog-chapter-custom">
                  <button
                    type="button"
                    id="chapter-custom-trigger"
                    class="catalog-chapter-trigger"
                    aria-haspopup="listbox"
                    aria-expanded="false"
                    aria-controls="chapter-custom-list"
                    aria-labelledby="chapters-label chapter-custom-trigger-label"
                    disabled
                  >
                    <span id="chapter-custom-trigger-label" class="catalog-chapter-trigger-label">Loading chapters…</span>
                  </button>
                  <ul
                    id="chapter-custom-list"
                    class="catalog-chapter-menu"
                    role="listbox"
                    aria-labelledby="chapters-label"
                    aria-hidden="true"
                    hidden
                    inert
                  ></ul>
                </div>
              </div>
            </div>
          </div>

          <p id="sources-history-back" class="sources-history-back-wrap" hidden>
            <button type="button" class="sources-history-back" aria-label="Back to previous page">
              <span aria-hidden="true">←</span> Back
            </button>
          </p>
          <h2 id="sources-heading" hidden>Sources</h2>
          <div id="sources-output" aria-live="polite"></div>
          <div id="catalog-pager" class="catalog-pager" hidden></div>
          <div id="catalog-notes" class="catalog-notes" hidden></div>
          <p id="back-to-top" hidden class="back-to-top">
            <a href="#sources-top" class="text-sm font-semibold text-accent hover:underline">↑ Back to Top</a>
          </p>
        </div>

      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <script>
    (async () => {
      const load = async (id, url) => {
        const res = await fetch(url, { cache: "no-cache" });
        document.getElementById(id).innerHTML = await res.text();
      };
      await Promise.all([
        load("site-header", "/header.html"),
        load("site-footer", "/footer.html"),
      ]);
      document.dispatchEvent(new Event('site-partials-loaded'));
    })();
  </script>

  <script src="/assets/js/minisearch.min.js"></script>
